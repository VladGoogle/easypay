apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      tier: elastic
  template:
    metadata:
      name: elastic
      labels:
        tier: elastic
    spec:
      containers:
        - name: elastic
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
          ports:
            - containerPort: 9200
          envFrom:
            - configMapRef:
                name: elastic-configmap
          volumeMounts:
            - name: elasticdata
              mountPath: /var/lib/elasticsearch/data
      volumes:
        - name: elasticdata
          persistentVolumeClaim:
            claimName: elastic-pvc