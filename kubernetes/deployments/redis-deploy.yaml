apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      tier: redis
  template:
    metadata:
      name: redis
      labels:
        tier: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379