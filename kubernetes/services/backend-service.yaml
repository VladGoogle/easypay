apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-ipv4: 10.0.1.6
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /api/v1
spec:
  type: LoadBalancer
  externalTrafficPolicy: 'Local'
  loadBalancerSourceRanges:
    - 10.0.1.0/24
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  selector:
    tier: backend

