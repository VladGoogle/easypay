  server:
    container_name: server
    restart: always
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT}:${PORT}"
    env_file: '.env'
    depends_on:
      - redis
      - kibana
      - elastic
      - db
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - shared_network
    command: yarn run start:dev

  db:
    container_name: db
    image: postgres:17-alpine
    restart: always
    ports:
      - '5432:5432'
    env_file: '.env'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shared_network

  redis:
    image: redis:latest
    restart: always
    container_name: redis
    networks:
      - shared_network

  elastic:
    restart: always
    container_name: elastic
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
    environment:
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms256m -Xmx256m'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - elasticdata:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'
    networks:
      - shared_network

  kibana:
      container_name: kibana
      restart: always
      image: docker.elastic.co/kibana/kibana:7.17.16
      ports:
        - '5601:5601'
      environment:
        ELASTICSEARCH_URL: 'http://elastic:9200'
        ELASTICSEARCH_HOSTS: '["http://elastic:9200"]'
      depends_on:
        - elastic
      networks:
        - shared_network

  backup:
    container_name: backup
    image: googlevlad/easypay-backup:latest
    depends_on:
      - db
    networks:
      - shared_network

volumes:
  pgdata:
    driver: local
  elasticdata:
    driver: local

networks:
  shared_network:
    driver: bridge
